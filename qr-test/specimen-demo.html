<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specimen QR Demo</title>
<style>
body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.10)}
header{padding:18px 20px 12px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf2ff;color:#315f9e;font-size:12px;margin-bottom:8px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0;color:#667085;font-size:14px}
img{display:block;width:100%;height:auto;background:#eee}
footer{padding:14px 20px 20px;font-size:13px;color:#667085}
</style>
</head>
<body>
<main>
  <section class="card">
    <header>
      <div class="badge">QR Delivery MVP — DEMO</div>
      <h1>ภาพสิ่งส่งตรวจหลังผ่าตัด</h1>
      <p>ตัวอย่างเปิดจาก QR โดยไม่ต้อง Login หรือ Password</p>
    </header>
    <img src="https://raw.githubusercontent.com/wearonds/womens-health-library/main/qr-test/specimen-demo-deidentified.jpg" alt="De-identified specimen demo">
    <footer>ภาพทดสอบนี้ตัดข้อมูลระบุตัวผู้ป่วยออกแล้ว และใช้เพื่อทดสอบระบบ QR เท่านั้น</footer>
  </section>
</main>
</body>
</html>
